add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://api.razorpay.com\" \"https://checkout.razorpay.com\")" always;
# same-origin-allow-popups (not same-origin): Razorpay Checkout opens bank pages in a popup and talks back to this window.
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
# Scripts only from this origin (no inline) plus Razorpay Checkout, loaded on demand by the wallet page; styles allow inline because
# Angular component styles are inlined; fonts and icons are bundled; API calls are same-origin through /api. The Razorpay hosts
# below are the ones Razorpay documents for Checkout (script, payment frame, its own API and telemetry calls, its logos).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.razorpay.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
