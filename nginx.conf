server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve "backend" through Docker's DNS on every request, so a recreated backend container is
    # found without restarting this one (courier-web resolves it once at start, which needed a restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    client_max_body_size 5m;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Runtime config must never be cached across deployments.
    location = /assets/config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
