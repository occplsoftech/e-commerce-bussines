server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Resolve "backend" through Docker's DNS on every request, so a recreated backend container is
    # found without restarting this one (courier-web resolves it once at start, which needed a restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    client_max_body_size 5m;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # nginx drops server-level add_header lines in any location that sets its own, so the shared
    # security headers live in one include and every location that adds a header includes it again.
    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Booking, tracking and label responses are per customer.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Runtime config must never be cached across deployments.
    location = /assets/config.json {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The shell must be re-fetched so a new release is picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
