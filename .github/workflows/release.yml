# After a merge to main: test, build and publish the image ghcr.io/<owner>/e-commerce-business (tags: commit SHA and
# "dev"). Deployment to the dev server is added with the hosting step (customer portal phase 6).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests and build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  image:
    name: Publish image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/e-commerce-business:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/e-commerce-business:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
